name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout/releases/tag/v6.0.1
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      # https://github.com/actions/setup-go/releases/tag/v6.2.0
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version: "1.25"

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race ./...

      - name: Test install script syntax
        run: bash -n install.sh

      - name: Test build and install
        run: |
          go build -o harvest-cli .
          mkdir -p "$HOME/.local/bin"
          install -m 755 harvest-cli "$HOME/.local/bin/harvest"
          "$HOME/.local/bin/harvest" --help
